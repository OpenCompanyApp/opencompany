# Local dev config for ginger-dev (`dev` CLI): https://github.com/ruttydm/ginger-dev
# Generated by `dev init`; edit freely. Unset keys fall back to the detected defaults.

stack = "laravel"
serve = "fpm"                            # fpm | proxy | static | none
root = "public"
install = ["composer install --no-interaction", "npm install"]
build = ["npm run build"]
migrate = "php artisan migrate --force --no-interaction"
files = ["storage/app"]

[db]
engine = "pgsql"
name = "opencompany"
extensions = ["vector"]

[env]                                    # .env keys dev manages ($URL $PORT $DB_* $MAIL_*)
APP_URL = "$URL"
DB_CONNECTION = "pgsql"
DB_HOST = "$DB_HOST"
DB_PORT = "$DB_PORT"
DB_DATABASE = "$DB_NAME"
DB_USERNAME = "$DB_USER"
DB_PASSWORD = "$DB_PASSWORD"
MAIL_MAILER = "smtp"
MAIL_HOST = "$MAIL_HOST"
MAIL_PORT = "$MAIL_PORT"

[processes]                              # started by `dev run`
reverb = "php artisan reverb:start"
queue = "php artisan queue:work --tries=3 --timeout=300 --memory=1024"
schedule = "php artisan schedule:work"

[optional]                               # only with `dev run --with <name>`
vite = "npm run dev"
