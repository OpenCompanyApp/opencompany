name: mruby contracts

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/mruby.yml'
      - 'app/Agents/Tools/Code/**'
      - 'app/Agents/Tools/ToolRegistry.php'
      - 'app/Agents/Tools/Workspace/**'
      - 'app/Agents/Tools/Charts/RenderSvg.php'
      - 'app/Domain/Automations/**'
      - 'app/Jobs/RunAutomationJob.php'
      - 'app/Jobs/RunScriptAutomationJob.php'
      - 'app/Services/ApprovalExecutionService.php'
      - 'app/Services/CodeApiDocGenerator.php'
      - 'app/Services/CodeBridge.php'
      - 'app/Services/Integrations/IntegrationRuntime.php'
      - 'app/Services/MrubySandboxService.php'
      - 'app/Services/ScriptAdmission.php'
      - 'app/Services/ScriptAutomationInvocation.php'
      - 'app/Services/ScriptCallbackReceiptService.php'
      - 'app/Services/OpenCompanyScriptToolInvoker.php'
      - 'app/Services/CodeExecution*.php'
      - 'config/code.php'
      - 'database/migrations/*mruby*'
      - 'resources/code-docs/**'
      - 'resources/js/**'
      - 'tests/Feature/Mruby*'
      - 'tests/Feature/ScriptAdmissionTest.php'
      - 'tests/Feature/ScriptCallbackAuthorizationTest.php'
      - 'tests/Feature/ScriptCallbackReceiptTest.php'
      - 'tests/Feature/CodeApiDocGeneratorTest.php'
      - 'tests/Feature/CodeBridgeTest.php'
      - 'tests/Feature/Integrations/IntegrationRuntimeWebToolTest.php'
      - 'tests/Feature/Tools/CodeExecTest.php'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/mruby.yml'
      - 'app/Agents/Tools/Code/**'
      - 'app/Agents/Tools/ToolRegistry.php'
      - 'app/Agents/Tools/Workspace/**'
      - 'app/Agents/Tools/Charts/RenderSvg.php'
      - 'app/Domain/Automations/**'
      - 'app/Jobs/RunAutomationJob.php'
      - 'app/Jobs/RunScriptAutomationJob.php'
      - 'app/Services/ApprovalExecutionService.php'
      - 'app/Services/CodeApiDocGenerator.php'
      - 'app/Services/CodeBridge.php'
      - 'app/Services/Integrations/IntegrationRuntime.php'
      - 'app/Services/MrubySandboxService.php'
      - 'app/Services/ScriptAdmission.php'
      - 'app/Services/ScriptAutomationInvocation.php'
      - 'app/Services/ScriptCallbackReceiptService.php'
      - 'app/Services/OpenCompanyScriptToolInvoker.php'
      - 'app/Services/CodeExecution*.php'
      - 'config/code.php'
      - 'database/migrations/*mruby*'
      - 'resources/code-docs/**'
      - 'resources/js/**'
      - 'tests/Feature/Mruby*'
      - 'tests/Feature/ScriptAdmissionTest.php'
      - 'tests/Feature/ScriptCallbackAuthorizationTest.php'
      - 'tests/Feature/ScriptCallbackReceiptTest.php'
      - 'tests/Feature/CodeApiDocGeneratorTest.php'
      - 'tests/Feature/CodeBridgeTest.php'
      - 'tests/Feature/Integrations/IntegrationRuntimeWebToolTest.php'
      - 'tests/Feature/Tools/CodeExecTest.php'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mruby-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: mruby runtime and UI contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      # composer.json intentionally uses sibling path repositories. Keep the
      # application checkout pristine and recreate that layout explicitly.
      # Pin the coordinated public integrations source; do not follow a mutable
      # feature branch for executable capability contracts.
      - name: Check out mruby integration sources
        run: |
          git clone --depth 1 --branch feat/mruby --single-branch \
            https://github.com/OpenCompanyApp/integrations.git \
            "$GITHUB_WORKSPACE/../integrations-mruby"
          git -C "$GITHUB_WORKSPACE/../integrations-mruby" fetch --depth 1 origin 30e48a7c8e0ec9508a8e7f6094cadddd21d486cc
          git -C "$GITHUB_WORKSPACE/../integrations-mruby" checkout --detach 30e48a7c8e0ec9508a8e7f6094cadddd21d486cc

      # These legacy path dependencies are still required by the app's locked
      # dependency graph. They are not part of this mruby workflow's runtime.
      - name: Check out remaining path dependencies
        run: |
          git clone --depth 1 https://github.com/OpenCompanyApp/astronomy-bundle-php.git tmp/astronomy-bundle-php
          git clone --depth 1 https://github.com/OpenCompanyApp/chatogrator.git tmp/chatogrator

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, dom, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Native source qualification belongs to the engine repository. Exercise
      # the actual versioned release bytes consumed by the application here.
      - name: Install checksum-pinned mruby release candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/ruby-engine
          curl --fail --location --retry 3 \
            https://github.com/OpenCompanyApp/bowerbird-ruby-engine/releases/download/v0.1.0-rc.1/bowerbird-ruby-engine-v0.1.0-rc.1-linux-amd64.tar.gz \
            --output .ci/ruby-engine.tar.gz
          echo '3c4b1d629d4813b5ffa977fc1559844c58ea94ffd391a6ffce9e7ac0b016605c  .ci/ruby-engine.tar.gz' | sha256sum --check
          tar -xzf .ci/ruby-engine.tar.gz --strip-components=1 -C .ci/ruby-engine
          engine_binary="$GITHUB_WORKSPACE/.ci/ruby-engine/bin/ruby-engine"
          test -x "$engine_binary"
          engine_sha256="$(sha256sum "$engine_binary" | awk '{print $1}')"
          {
            echo "RUBY_ENGINE_BINARY=$engine_binary"
            echo "RUBY_ENGINE_SHA256=$engine_sha256"
          } >> "$GITHUB_ENV"

      - name: Run focused mruby PHP contracts
        env:
          APP_ENV: testing
        run: |
          php artisan test --compact \
            tests/Feature/MrubySandboxServiceTest.php \
            tests/Feature/MrubySandboxSecurityTest.php \
            tests/Feature/MrubyDocumentationTest.php \
            tests/Feature/MrubyIntegrationValueTest.php \
            tests/Feature/MrubySourceMigrationTest.php \
            tests/Feature/MrubyAgentExperienceTest.php \
            tests/Feature/MrubyAutomationQueueTest.php \
            tests/Feature/MrubyExecutionBudgetTest.php \
            tests/Feature/MrubyHostControlTest.php \
            tests/Feature/MrubyScriptHistoryTest.php \
            tests/Feature/ScriptAdmissionTest.php \
            tests/Feature/ScriptCallbackAuthorizationTest.php \
            tests/Feature/ScriptCallbackReceiptTest.php \
            tests/Feature/CodeApiDocGeneratorTest.php \
            tests/Feature/CodeBridgeTest.php \
            tests/Feature/Integrations/IntegrationRuntimeWebToolTest.php \
            tests/Feature/Tools/CodeExecTest.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Type-check and build the UI
        env:
          WAYFINDER_SKIP_GENERATE: 'true'
        run: |
          npm ci
          npm run build:typecheck
