name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone local packages
        run: |
          git clone https://github.com/OpenCompanyApp/integrations.git ../integrations
          git clone https://github.com/OpenCompanyApp/astronomy-bundle-php.git tmp/astronomy-bundle-php
          git clone https://github.com/OpenCompanyApp/chatogrator.git tmp/chatogrator
          git clone https://github.com/OpenCompanyApp/prism-codex.git tmp/prism-codex

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, dom
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M
