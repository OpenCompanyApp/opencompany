name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone local packages
        run: |
          git clone --branch "${INTEGRATIONS_REF}" --single-branch https://github.com/OpenCompanyApp/integrations.git ../integrations
          git clone https://github.com/OpenCompanyApp/astronomy-bundle-php.git tmp/astronomy-bundle-php
          git clone https://github.com/OpenCompanyApp/chatogrator.git tmp/chatogrator
          git clone https://github.com/OpenCompanyApp/prism-codex.git tmp/prism-codex
        env:
          INTEGRATIONS_REF: feat/quickjs

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, dom, sqlite3
          coverage: none

      - name: Install pinned QuickJS sandbox extension
        env:
          QUICKJS_SANDBOX_SHA256: 1030bdb948c056bacc607ddec0e825872622b1bdd214dc758696691644ce4097
        run: |
          curl -fsSL https://github.com/OpenCompanyApp/quickjs-sandbox/releases/download/v1.0.1/quickjs_sandbox-php84-nts-linux-x86_64.so -o /tmp/quickjs_sandbox.so
          echo "${QUICKJS_SANDBOX_SHA256}  /tmp/quickjs_sandbox.so" | sha256sum -c -
          sudo install -m 0644 /tmp/quickjs_sandbox.so "$(php-config --extension-dir)/quickjs_sandbox.so"
          echo 'extension=quickjs_sandbox.so' | sudo tee "$(php --ini | sed -n 's|Scan for additional .ini files in: ||p')/30-quickjs_sandbox.ini"
          php --ri quickjs_sandbox

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run backend suite
        run: php artisan test

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vue typecheck
        run: npm run typecheck

      - name: Build production assets
        run: WAYFINDER_SKIP_GENERATE=true npm run build

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone local packages
        run: |
          git clone --branch "${INTEGRATIONS_REF}" --single-branch https://github.com/OpenCompanyApp/integrations.git ../integrations
          git clone https://github.com/OpenCompanyApp/astronomy-bundle-php.git tmp/astronomy-bundle-php
          git clone https://github.com/OpenCompanyApp/chatogrator.git tmp/chatogrator
          git clone https://github.com/OpenCompanyApp/prism-codex.git tmp/prism-codex
        env:
          # The hard-cut application PR and package PR are intentionally paired.
          # Change this back to main once the package migration lands.
          INTEGRATIONS_REF: feat/quickjs

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, dom
          coverage: none

      - name: Install pinned QuickJS sandbox extension
        env:
          QUICKJS_SANDBOX_SHA256: 1030bdb948c056bacc607ddec0e825872622b1bdd214dc758696691644ce4097
        run: |
          curl -fsSL https://github.com/OpenCompanyApp/quickjs-sandbox/releases/download/v1.0.1/quickjs_sandbox-php84-nts-linux-x86_64.so -o /tmp/quickjs_sandbox.so
          echo "${QUICKJS_SANDBOX_SHA256}  /tmp/quickjs_sandbox.so" | sha256sum -c -
          sudo install -m 0644 /tmp/quickjs_sandbox.so "$(php-config --extension-dir)/quickjs_sandbox.so"
          echo 'extension=quickjs_sandbox.so' | sudo tee "$(php --ini | sed -n 's|Scan for additional .ini files in: ||p')/30-quickjs_sandbox.ini"
          php --ri quickjs_sandbox

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        # The complete app plus 591 path-based integration packages exceeds
        # 512 MiB during PHPStan's parallel analysis on GitHub runners.
        run: vendor/bin/phpstan analyse --memory-limit=2G

  production-image:
    name: Production image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone Docker build contexts
        run: |
          git clone --branch "${INTEGRATIONS_REF}" --single-branch https://github.com/OpenCompanyApp/integrations.git ../integrations
          git clone https://github.com/OpenCompanyApp/astronomy-bundle-php.git tmp/astronomy-bundle-php
        env:
          INTEGRATIONS_REF: feat/quickjs

      - name: Build the exact production image
        run: docker build --build-context integrations=../integrations --tag opencompany-quickjs-ci .

      - name: Smoke-test the native runtime in the image
        run: |
          docker run --rm --entrypoint php opencompany-quickjs-ci --ri quickjs_sandbox
          docker run --rm --entrypoint php opencompany-quickjs-ci -r '
            $sandbox = new QuickJS\Sandbox(memory_limit: 33554432, cpu_limit: 1.0, stack_limit: 524288);
            $script = $sandbox->load("return 6 * 7;");
            exit($script() === 42 ? 0 : 1);
          '
          docker run --rm --entrypoint php opencompany-quickjs-ci -r '
            $removedDialect = "l" . "uau";
            $removedLanguage = "l" . "ua";
            exit(extension_loaded("quickjs_sandbox") && ! extension_loaded($removedDialect) && ! extension_loaded($removedLanguage) ? 0 : 1);
          '
