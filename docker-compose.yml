services:
  app:
    build:
      context: .
      additional_contexts:
        integrations: ../integrations
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:-}"
      APP_NAME: OpenCompany
      APP_URL: "${SERVICE_URL_APP:-http://localhost:8000}"
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-opencompany}
      DB_USERNAME: ${DB_USERNAME:-opencompany}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-opencompany}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: "${REVERB_HOST:-localhost}"
      REVERB_PORT: "${REVERB_PORT:-8080}"
      REVERB_SCHEME: "${REVERB_SCHEME:-http}"
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_APP_ID: ${REVERB_APP_ID:-1000001}
      REVERB_APP_KEY: ${SERVICE_PASSWORD_REVERBKEY}
      REVERB_APP_SECRET: ${SERVICE_PASSWORD_REVERBSECRET}
      PRISM_REQUEST_TIMEOUT: "1800"
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${DB_DATABASE:-opencompany}
      POSTGRES_USER: ${DB_USERNAME:-opencompany}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-opencompany}
    volumes:
      - pgdata:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-opencompany}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  storage:
