# Local development with Docker
# Usage: docker compose -f docker-compose.local.yml up --build
#
# App:    http://localhost:8000
# Reverb: ws://localhost:8080

services:
  app:
    build:
      context: .
      additional_contexts:
        integrations: ../integrations
    platform: linux/amd64
    ports:
      - "8000:8000"
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_NAME: OpenCompany
      APP_URL: http://localhost:8000
      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:8000,127.0.0.1,127.0.0.1:8000"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: opencompany
      DB_USERNAME: opencompany
      DB_PASSWORD: opencompany
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: localhost
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_APP_ID: "1000001"
      REVERB_APP_KEY: local-reverb-key
      REVERB_APP_SECRET: local-reverb-secret
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: opencompany
      POSTGRES_USER: opencompany
      POSTGRES_PASSWORD: opencompany
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencompany"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  storage:
